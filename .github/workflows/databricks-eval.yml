name: Databricks Notebook Eval

on:
  schedule:
    - cron: "0 6 * * *"    # Every day at 6am UTC — adjust as needed
  workflow_dispatch:         # Also allows manual trigger from GitHub UI

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Run Databricks Notebook
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          pip install databricks-sdk

          python - <<'EOF'
          import os, time
          from databricks.sdk import WorkspaceClient
          from databricks.sdk.service.jobs import RunLifeCycleState, RunResultState

          w = WorkspaceClient(
              host  = os.environ["DATABRICKS_HOST"],
              token = os.environ["DATABRICKS_TOKEN"],
          )

          NOTEBOOK_PATH = "/Users/your-email@example.com/your-notebook-path"  # ← change this

          print(f"Submitting notebook: {NOTEBOOK_PATH}")
          run = w.jobs.submit(
              run_name="github-actions-eval",
              tasks=[{
                  "task_key": "eval",
                  "notebook_task": {"notebook_path": NOTEBOOK_PATH},
                  "new_cluster": {
                      "spark_version": "15.4.x-scala2.12",
                      "node_type_id":  "i3.xlarge",   # change to match your cloud/region
                      "num_workers":   1,
                  },
              }],
          ).result()

          run_id = run.run_id
          print(f"Run ID: {run_id}")

          # Poll until done
          while True:
              state = w.jobs.get_run(run_id=run_id).state
              lc    = state.life_cycle_state
              print(f"  Status: {lc.value}")
              if lc in (RunLifeCycleState.TERMINATED, RunLifeCycleState.SKIPPED, RunLifeCycleState.INTERNAL_ERROR):
                  break
              time.sleep(15)

          result = state.result_state
          print(f"Result: {result.value}")
          if result != RunResultState.SUCCESS:
              raise SystemExit(f"❌ Notebook run failed: {result.value}")
          print("✅ Notebook completed successfully")
          EOF
