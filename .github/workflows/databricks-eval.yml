name: Run Databricks Eval Job daily

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 09:00 UTC (10:00 UK summer time)
  workflow_dispatch:       # adds a "Run workflow" button for manual runs

jobs:
  trigger-databricks-job:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger job 419594233060797
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          curl -sS --fail -X POST "$DATABRICKS_HOST/api/2.2/jobs/run-now" \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"job_id": 419594233060797}'
